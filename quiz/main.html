<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kiểm tra</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #3A6EA5;
      color: #fff;
      min-height: 100vh;
      padding: 40px 24px;
    }

    h2 { font-size: 1.5rem; margin-bottom: 6px; }
    h2 span { color: #FF6B6B; }
    .subtitle { color: #C8DCF0; font-size: 0.9rem; margin-bottom: 32px; }

    /* QUIZ CARD */
    .quiz-wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    .progress-bar-wrap {
      background: #2D5A8E;
      border-radius: 99px;
      height: 6px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%; background: #FF6B6B;
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .progress-label { font-size: 0.75rem; color: #7AADD4; margin-bottom: 8px; }

    .video-box {
      background: #0a0a0e;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid #4A7EB5;
    }
    .quiz-video { width: 100%; aspect-ratio: 16/9; display: block; object-fit: contain; }
    .no-video { padding: 40px; text-align: center; color: #555; font-size: 0.82rem; }
    .no-video code { color: #FF6B6B; }

    .question-label { font-size: 0.82rem; color: #C8DCF0; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    .choice-btn {
      background: #2D5A8E;
      border: 2px solid #4A7EB5;
      color: #fff;
      padding: 14px 10px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .choice-btn:hover { background: #1E3F6B; border-color: #FF6B6B; transform: translateY(-2px); }
    .choice-btn.correct { background: #1a4a2e; border-color: #6EE7B7; color: #6EE7B7; pointer-events: none; }
    .choice-btn.wrong   { background: #4a1a1a; border-color: #FF6B6B; color: #FF6B6B; pointer-events: none; }
    .choice-btn.disabled { pointer-events: none; opacity: 0.5; }

    .feedback {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      min-height: 28px;
      margin-bottom: 16px;
    }
    .feedback.ok  { color: #6EE7B7; }
    .feedback.err { color: #FF6B6B; }

    .next-btn {
      display: block; width: 100%;
      background: #FF6B6B; border: none; color: #fff;
      padding: 13px; border-radius: 12px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: background 0.15s;
      display: none;
    }
    .next-btn:hover { background: #e04f4f; }

    /* SCORE */
    .score-wrap {
      text-align: center;
      display: none;
    }
    .score-wrap h3 { font-size: 2rem; margin-bottom: 8px; }
    .score-wrap .big { font-size: 3.5rem; font-weight: 800; color: #FF6B6B; }
    .restart-btn {
      margin-top: 20px;
      background: #FF6B6B; border: none; color: #fff;
      padding: 12px 32px; border-radius: 12px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .restart-btn:hover { background: #e04f4f; }
  </style>
</head>
<body>

<h2>Kiểm tra <span>Ký hiệu</span></h2>
<p class="subtitle">Xem video rồi chọn đáp án đúng</p>

<div class="quiz-wrap">
  <p class="progress-label" id="progressLabel">Câu 1 / 3</p>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div id="quizArea">
    <div class="video-box">
      <video class="quiz-video" id="qVideo" autoplay loop playsinline muted></video>
      <div class="no-video" id="noVid" style="display:none">Video chưa có<br><code id="noVidPath"></code></div>
    </div>

    <p class="question-label">Đây là ký hiệu của từ nào?</p>

    <div class="choices" id="choices"></div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Câu tiếp →</button>
  </div>

  <div class="score-wrap" id="scoreWrap">
    <h3>Kết quả</h3>
    <div class="big" id="scoreBig">0/3</div>
    <p style="color:#C8DCF0; margin-top:8px">Làm lại để cải thiện nhé!</p>
    <button class="restart-btn" onclick="startQuiz()">🔄 Làm lại</button>
  </div>
</div>

<script>
const WORDS = [
  { label:"Ăn",      videoFile:"an.mp4"      },
  { label:"Bàn chân",videoFile:"ban_chan.mp4" },
  { label:"Bạn",     videoFile:"ban.mp4"      },
];
const VIDEO_DIR = "../learn/videos/";

let queue = [], qIdx = 0, score = 0;

function shuffle(arr) { return [...arr].sort(() => Math.random()-0.5); }

function startQuiz() {
  queue = shuffle(WORDS);
  qIdx = 0; score = 0;
  document.getElementById("quizArea").style.display = "block";
  document.getElementById("scoreWrap").style.display = "none";
  showQ();
}

function showQ() {
  const w = queue[qIdx];
  const total = queue.length;
  document.getElementById("progressLabel").textContent = `Câu ${qIdx+1} / ${total}`;
  document.getElementById("progressBar").style.width   = `${(qIdx/total)*100}%`;
  document.getElementById("feedback").textContent = "";
  document.getElementById("nextBtn").style.display = "none";

  // Video
  const vid = document.getElementById("qVideo");
  const noVid = document.getElementById("noVid");
  vid.style.display = "block"; noVid.style.display = "none";
  vid.src = VIDEO_DIR + w.videoFile;
  vid.load(); vid.play().catch(()=>{});
  vid.onerror = () => {
    vid.style.display = "none"; noVid.style.display = "block";
    document.getElementById("noVidPath").textContent = w.videoFile;
  };

  // Choices: đúng + 2 sai
  const wrong = shuffle(WORDS.filter(x => x.label !== w.label)).slice(0, 2);
  const opts  = shuffle([w, ...wrong]);
  const box   = document.getElementById("choices");
  box.innerHTML = "";
  opts.forEach(opt => {
    const b = document.createElement("button");
    b.className = "choice-btn";
    b.textContent = opt.label;
    b.onclick = () => answer(b, opt.label === w.label, w.label);
    box.appendChild(b);
  });
}

function answer(btn, correct, rightLabel) {
  document.querySelectorAll(".choice-btn").forEach(b => {
    if (b.textContent === rightLabel) b.classList.add("correct");
    else b.classList.add(b === btn && !correct ? "wrong" : "disabled");
  });

  const fb = document.getElementById("feedback");
  if (correct) { score++; fb.textContent = "✅ Chính xác!"; fb.className = "feedback ok"; }
  else         { fb.textContent = `❌ Sai! Đáp án: ${rightLabel}`; fb.className = "feedback err"; }

  document.getElementById("nextBtn").style.display = "block";
}

document.getElementById("nextBtn").onclick = () => {
  qIdx++;
  if (qIdx < queue.length) { showQ(); }
  else {
    document.getElementById("quizArea").style.display  = "none";
    document.getElementById("scoreWrap").style.display = "block";
    document.getElementById("progressBar").style.width = "100%";
    document.getElementById("scoreBig").textContent    = `${score}/${queue.length}`;
  }
};

startQuiz();
</script>
</body>
</html>

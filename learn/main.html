<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SignVN — Học Ngôn Ngữ Ký Hiệu Việt Nam theo chủ đề" />
  <title>SignVN — Học Ngôn Ngữ Ký Hiệu</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./learn.css">
</head>
<body>

  <main>
    <!-- Page Header -->
    <header class="page-header">
      <div class="page-header-inner">
        <div class="page-logo">
          <span class="logo-icon">🤟</span>
          <span class="logo-text">SignVN</span>
        </div>
        <div class="page-header-text">
          <h1>Học theo chủ đề</h1>
          <p>Chọn chủ đề bạn muốn học để bắt đầu hành trình khám phá ngôn ngữ ký hiệu Việt Nam.</p>
        </div>
      </div>
    </header>

    <!-- App Body -->
    <div class="app-body">

      <!-- Left Sidebar -->
      <aside class="sidebar" aria-label="Danh sách chủ đề">
        <div class="section-label">Danh sách chủ đề</div>
        <nav class="topic-nav" id="topicNav" role="list"></nav>
      </aside>

      <!-- Right Content -->
      <div class="content-area" role="main">
        <div class="section-label">Chủ đề đang học</div>
        <div class="featured-card" id="featuredCard" aria-live="polite">
          <!-- populated by JS -->
        </div>
      </div>  

    </div>
  </main>

  <!-- ONNX Runtime (loaded as classic script so .wasm files resolve correctly) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>

  <!-- Import Map for Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./learn.js"></script>

</body>
</html>

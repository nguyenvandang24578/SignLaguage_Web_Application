<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="color-scheme" content="light" />
    <title>VNSignMate Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- ── SIDEBAR ── -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
            />
          </svg>
          Sign Language
        </div>

        <button class="sidebar-btn" id="btn-new-chat" type="button">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
          New chat
        </button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Conversations</div>
        <div id="session-list">
          <div class="sidebar-empty">No conversations yet</div>
        </div>
      </aside>

      <!-- ── MAIN ── -->
      <div class="main">
        <div class="messages" id="messages">
          <div class="welcome" id="welcome">
            <h2>VNSignMateVN Assistant</h2>
            <p>Nhập tin nhắn để bắt đầu</p>
          </div>
        </div>

        <div class="input-area">
          <div class="input-wrapper">
            <div class="input-box">
              <textarea
                id="prompt"
                placeholder="Nói gì đó..."
                rows="1"
              ></textarea>
              <button class="send-btn" id="send-btn" type="button">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 5l7 7-7 7M5 12h14" />
                </svg>
              </button>
              <button class="cancel-btn" id="cancel-btn" type="button" style="display: none;">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M18 6L6 18M6 6l12 12" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── TOAST ── -->
    <div class="toast" id="toast"></div>

    <!-- ── CONFIRM DELETE MODAL ── -->
    <div class="confirm-modal-overlay" id="confirm-modal">
      <div class="confirm-modal">
        <p id="confirm-modal-title">Xoá cuộc trò chuyện này?</p>
        <div class="confirm-modal-actions">
          <button class="btn-cancel" id="btn-confirm-no" type="button">
            Huỷ
          </button>
          <button class="btn-delete" id="btn-confirm-yes" type="button">
            Xoá
          </button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>

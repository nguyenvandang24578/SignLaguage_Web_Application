<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="color-scheme" content="dark" />
    <title>Sign Language Chatbot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- ── SIDEBAR ── -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
            />
          </svg>
          Sign Language
        </div>

        <button class="sidebar-btn" id="btn-new-chat" type="button">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
          New chat
        </button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Conversations</div>
        <div id="session-list">
          <div class="sidebar-empty">No conversations yet</div>
        </div>

        <div class="sidebar-footer">
          <button class="settings-btn" type="button">
            <span>Settings</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              style="width: 14px; height: 14px"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"
              />
            </svg>
          </button>
        </div>
      </aside>

      <!-- ── MAIN ── -->
      <div class="main">
        <div class="messages" id="messages">
          <div class="welcome" id="welcome">
            <h2>Sign Language Chatbot</h2>
            <p>Nhập tin nhắn để bắt đầu</p>
          </div>
        </div>

        <div class="input-area">
          <div class="input-wrapper">
            <div class="input-box">
              <textarea
                id="prompt"
                placeholder="Nói gì đó..."
                rows="1"
              ></textarea>
              <button class="send-btn" id="send-btn" type="button">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 5l7 7-7 7M5 12h14" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- /.app -->

    </div>

    <!-- Hidden file input -->
    <input
      type="file"
      id="avatar-file-input"
      accept="image/*"
      style="display: none"
    />

    <script src="app.js"></script>
  </body>
</html>

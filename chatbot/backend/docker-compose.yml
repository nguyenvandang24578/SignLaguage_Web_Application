services:
  chatbot-backend:
    build: .
    container_name: chatbot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LLAMA_SERVER_URL=http://llama-server:8080/v1/chat/completions
    volumes:
      - ./data:/app/data
    depends_on:
      - llama-server
      - redis
    restart: unless-stopped

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    command: >
      --host 0.0.0.0
      --port 8080
      -m /models/qwen3.gguf
      -c 4096
      -ngl 99
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    # Neu khong co GPU, doi image thanh ghcr.io/ggml-org/llama.cpp:server
    # va xoa block deploy, doi -ngl 99 thanh -ngl 0

  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
services:
  chatbot-backend:
    build: .
    container_name: chatbot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LLAMA_SERVER_URL=http://llama-server:8080/v1/chat/completions
    volumes:
      - ./data:/app/data
    depends_on:
      - llama-server
      - redis
    restart: unless-stopped

  llama-server:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: llama-server
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    command: >
      --host 0.0.0.0
      --port 8080
      -m /models/qwen3.gguf
      -c 4096
      -ngl 0
    restart: unless-stopped
    # Nếu có GPU NVIDIA, uncomment 2 dòng dưới và đổi image thành ghcr.io/ggerganov/llama.cpp:server-cuda
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

# =============================================================================
# VNSignMate — Docker Compose
# =============================================================================
# Chạy toàn bộ ứng dụng (frontend + backend) chỉ với một lệnh:
#
#   docker compose up -d
#
# Truy cập: http://localhost:8080
# =============================================================================

services:
  # ── Backend: FastAPI + ChromaDB ─────────────────────────
  backend:
    build:
      context: ./chatbot/backend
      dockerfile: Dockerfile
    container_name: vsl-backend
    restart: unless-stopped
    env_file:
      - ./chatbot/backend/.env
    volumes:
      # Lưu chat history và vector database ra ngoài để không mất khi restart
      - vsl_chat_history:/app/chat_history
      - vsl_chroma_db:/app/chroma_db
    environment:
      - CHROMA_PATH=/app/chroma_db
      - DB_PATH=/app/chat_history/chat.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - vsl_network

  # ── Frontend: Nginx (static files + reverse proxy) ─────
  app:
    image: nginx:alpine
    container_name: vsl-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Nginx config
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Toàn bộ source code (static files)
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./Logo-HCMUTE.png:/usr/share/nginx/html/Logo-HCMUTE.png:ro
      - ./learn:/usr/share/nginx/html/learn:ro
      - ./quiz:/usr/share/nginx/html/quiz:ro
      - ./chatbot/frontend:/usr/share/nginx/html/chatbot/frontend:ro
      - ./data:/usr/share/nginx/html/data:ro
      - ./imgs:/usr/share/nginx/html/imgs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vsl_network

networks:
  vsl_network:
    driver: bridge

volumes:
  vsl_chat_history:
  vsl_chroma_db:
